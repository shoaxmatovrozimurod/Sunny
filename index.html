<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/main.css">
    <title>Sunny</title>
</head>

<body>
    <header class="header">
        <h1 class="visually-hidden">Sahifamiz haqida</h1>
        <div class="container">
            <div class="header-box">
                <!-- Logo -->
                <a href="#" class="header-logo">
                    <h2 class="header-logo-title">Sunny</h2>
                </a>

                <!-- Navigatsiya Menyusi -->
                <nav class="header-nav" id="headerNav">
                    <ul class="header-box-list">
                        <li class="header-box-item"><a class="header-box-item-link" href="#">Home</a></li>
                        <li class="header-box-item"><a class="header-box-item-link" href="#">About us</a></li>
                        <li class="header-box-item"><a class="header-box-item-link" href="#">Products</a></li>
                        <li class="header-box-item"><a class="header-box-item-link" href="#">Faqs</a></li>
                        <li class="header-box-item"><a class="header-box-item-link" href="#">Contact us</a></li>
                    </ul>
                </nav>

                <!-- On-screen Ikonkalar -->
                <div class="header-icns">
                    <a href="#" class="icon-link" aria-label="Search">
                        <img class="header-icns-img" src="./images/icn1.svg" alt="Search">
                    </a>
                    <a href="#" class="icon-link" aria-label="Cart">
                        <img class="header-icns-img" src="./images/icn2.png" alt="Bag">
                    </a>
                    <a href="#" class="icon-link" aria-label="Profile">
                        <svg class="header-icns-svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z"
                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M20.59 22C20.59 18.13 16.74 15 12 15C7.26003 15 3.41003 18.13 3.41003 22"
                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </a>
                </div>

                <!-- Mobile Burger Button -->
                <button class="bars" id="burgerBtn" aria-label="Toggle Menu">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            </div>
        </div>
    </header>
    <!-- ---------------------hero------------------- -->
    <div class="hero">
        <div class="container">
            <div class="hero-container">
                <div class="hero-box">
                    <span class="hero-box-sn">Free delivery worldwide</span>
                    <h2 class="hero-box-title">Foundation Matte & Poreless</h2>
                    <p class="hero-box-text">Maybellin’s #1 foundation perfect for oily skin.no stickiness,no shine.</p>
                    <div class="hero-button">
                        <button class="hero-button-btn">Add to cart</button>
                        <span class="hero-button-sn"><img src="./images/vid.png" width="60" height="60" alt="vidyoni ko'rish tugmasi"> How it work</span>
                    </div>
                </div>

                <div class="hero-wrapper">
                    <img src="./images/maz.png" width="270px" height="255px" alt="Mockup design">
                    <div class="hero-wrapper-inner">
                        <p class="hero-inner-title">Details</p>
                        <h3 class="hero-inner-text">$100.45</h3>
                        <p class="hero-inner-title">30 ml</p>
                        <img src="./images/baholash.png" alt="yulduscha orqali baxolash">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/main.js"></script>
</body>

</html>
